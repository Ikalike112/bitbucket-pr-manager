name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.archive }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: windows
          - os: macos-latest
            archive: macos-arm64
          - os: macos-15-intel
            archive: macos-intel
          - os: ubuntu-latest
            archive: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Check app and run tests
        run: |
          python -c "import tkinter"
          python -m unittest discover -s tests -p "test_*.py"
      - name: Install build dependency
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name BitbucketPRManager app/bitbucket_pr_ui.py
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/BitbucketPRManager.exe -DestinationPath bitbucket-pr-manager-windows.zip
      - name: Package macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/BitbucketPRManager.app bitbucket-pr-manager-${{ matrix.archive }}.zip
      - name: Package Linux executable
        if: runner.os == 'Linux'
        run: tar -czf bitbucket-pr-manager-linux.tar.gz -C dist BitbucketPRManager
      - uses: actions/upload-artifact@v4
        with:
          name: bitbucket-pr-manager-${{ matrix.archive }}
          path: |
            bitbucket-pr-manager-*.zip
            bitbucket-pr-manager-*.tar.gz
          if-no-files-found: error

  release:
    name: Attach builds to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bitbucket-pr-manager-*
          path: release
          merge-multiple: true
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "$TAG" --generate-notes
          fi
